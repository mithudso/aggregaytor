<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aggregaytor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #0f1419;
      color: #e7e9ea;
      font-size: 14px;
      overflow-x: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    .header {
      padding: 10px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .header h1 { font-size: 17px; font-weight: 700; }
    .header-back {
      display: none;
      background: none; border: none; color: #93c5fd;
      font-size: 13px; cursor: pointer; padding: 4px 0;
    }
    .header-back:hover { color: #bfdbfe; }

    /* ── Platform filters ── */
    .platform-filters {
      display: flex;
      gap: 6px;
      padding: 8px 12px;
      overflow-x: auto;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      flex-shrink: 0;
    }
    .platform-chip {
      padding: 4px 10px;
      border-radius: 16px;
      font-size: 12px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.05);
      color: #9ca3af;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .platform-chip.active {
      background: rgba(59,130,246,0.2);
      border-color: rgba(59,130,246,0.5);
      color: #93c5fd;
    }

    /* ── Inbox list ── */
    .thread-list { flex: 1; overflow-y: auto; }
    .thread-item {
      display: flex;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      cursor: pointer;
      transition: background 0.1s;
    }
    .thread-item:hover { background: rgba(255,255,255,0.04); }
    .thread-item.unread { background: rgba(59,130,246,0.06); }
    .thread-item.unread .thread-name { color: #93c5fd; }
    .avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 600; color: rgba(255,255,255,0.6);
      position: relative;
    }
    .platform-dot {
      position: absolute; bottom: -1px; right: -1px;
      width: 14px; height: 14px; border-radius: 50%;
      border: 2px solid #0f1419;
      font-size: 7px; display: flex; align-items: center; justify-content: center;
    }
    .platform-dot.sniffies { background: #7c3aed; }
    .platform-dot.grindr { background: #fbbf24; }
    .platform-dot.doublelist { background: #10b981; }
    .platform-dot.adam4adam { background: #ef4444; }
    .platform-dot.gmail { background: #f97316; }
    .platform-dot.yahoo { background: #6366f1; }
    .thread-content { flex: 1; min-width: 0; }
    .thread-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; }
    .thread-name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .thread-time { font-size: 11px; color: #6b7280; flex-shrink: 0; margin-left: 8px; }
    .thread-preview {
      font-size: 13px; color: #9ca3af;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      display: flex; align-items: center; gap: 6px;
    }
    .unread-badge {
      background: #3b82f6; color: white;
      font-size: 10px; padding: 1px 6px; border-radius: 10px; font-weight: 600;
      flex-shrink: 0;
    }

    /* ── Thread detail view ── */
    .thread-detail { display: none; flex-direction: column; flex: 1; overflow: hidden; }
    .thread-detail.active { display: flex; }
    .message-list {
      flex: 1; overflow-y: auto; padding: 12px 16px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .msg-bubble {
      max-width: 85%; padding: 8px 12px;
      border-radius: 12px; font-size: 13px; line-height: 1.4;
      word-break: break-word; white-space: pre-wrap;
    }
    .msg-bubble.in {
      align-self: flex-start;
      background: rgba(255,255,255,0.08);
      border-bottom-left-radius: 4px;
    }
    .msg-bubble.out {
      align-self: flex-end;
      background: rgba(59,130,246,0.2);
      border-bottom-right-radius: 4px;
    }
    .msg-time {
      font-size: 10px; color: #6b7280; margin-top: 2px;
    }
    .msg-time.out { text-align: right; }
    .msg-date-sep {
      text-align: center; font-size: 11px; color: #6b7280;
      margin: 10px 0 6px; position: relative;
    }
    .msg-date-sep::before, .msg-date-sep::after {
      content: ''; position: absolute; top: 50%;
      width: calc(50% - 50px); height: 1px;
      background: rgba(255,255,255,0.06);
    }
    .msg-date-sep::before { left: 0; }
    .msg-date-sep::after { right: 0; }

    /* ── Response input ── */
    .response-bar {
      padding: 10px 12px;
      border-top: 1px solid rgba(255,255,255,0.1);
      display: flex; gap: 8px; align-items: flex-end;
      flex-shrink: 0;
    }
    .response-bar textarea {
      flex: 1; resize: none; border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.06);
      color: #e7e9ea; font-size: 13px;
      padding: 8px 14px; min-height: 36px; max-height: 120px;
      font-family: inherit; outline: none;
    }
    .response-bar textarea:focus { border-color: rgba(59,130,246,0.5); }
    .response-bar textarea::placeholder { color: #6b7280; }
    .suggest-btn {
      background: rgba(59,130,246,0.15); border: 1px solid rgba(59,130,246,0.3);
      color: #93c5fd; border-radius: 18px; padding: 8px 14px;
      font-size: 12px; cursor: pointer; white-space: nowrap; flex-shrink: 0;
    }
    .suggest-btn:hover { background: rgba(59,130,246,0.25); }
    .suggest-btn:disabled { opacity: 0.5; cursor: default; }

    /* ── Suggestion bubble ── */
    .suggestions {
      padding: 6px 12px 4px;
      display: none; flex-direction: column; gap: 4px;
      border-top: 1px solid rgba(255,255,255,0.06);
    }
    .suggestions.active { display: flex; }
    .suggestions .label { font-size: 10px; color: #6b7280; margin-bottom: 2px; }
    .suggestion-chip {
      background: rgba(124,58,237,0.12); border: 1px solid rgba(124,58,237,0.25);
      color: #c4b5fd; border-radius: 10px; padding: 6px 10px;
      font-size: 12px; cursor: pointer; text-align: left;
      word-break: break-word; line-height: 1.3;
    }
    .suggestion-chip:hover { background: rgba(124,58,237,0.2); }

    /* ── Empty state ── */
    .empty-state {
      text-align: center; padding: 48px 24px; color: #6b7280;
    }
    .empty-state h2 { font-size: 16px; margin-bottom: 8px; color: #9ca3af; }

    /* ── View toggle ── */
    .view-inbox .thread-detail,
    .view-inbox .response-bar,
    .view-inbox .suggestions { display: none; }
    .view-thread .thread-list,
    .view-thread .platform-filters { display: none; }
    .view-thread .thread-detail { display: flex; }
    .view-thread .response-bar { display: flex; }
    .view-thread .header-back { display: inline; }
  </style>
</head>
<body class="view-inbox">
  <div class="header">
    <button class="header-back" id="back-btn">&larr; Back</button>
    <h1 id="header-title">Aggregaytor</h1>
    <span id="total-unread" class="unread-badge" style="display:none"></span>
  </div>

  <div class="platform-filters">
    <span class="platform-chip active" data-platform="all">All</span>
    <span class="platform-chip" data-platform="sniffies">Sniffies</span>
    <span class="platform-chip" data-platform="grindr">Grindr</span>
    <span class="platform-chip" data-platform="doublelist">DList</span>
    <span class="platform-chip" data-platform="adam4adam">A4A</span>
    <span class="platform-chip" data-platform="gmail">Gmail</span>
    <span class="platform-chip" data-platform="yahoo">Yahoo</span>
  </div>

  <div id="thread-list" class="thread-list">
    <div class="empty-state">
      <h2>No messages yet</h2>
      <p>Visit a connected site to start capturing messages.</p>
    </div>
  </div>

  <div id="thread-detail" class="thread-detail">
    <div id="message-list" class="message-list"></div>
  </div>

  <div id="suggestions" class="suggestions">
    <div class="label">Suggested responses</div>
  </div>

  <div class="response-bar">
    <textarea id="response-input" rows="1" placeholder="Type a response..."></textarea>
    <button class="suggest-btn" id="suggest-btn">Suggest</button>
  </div>

  <script src="panel.js"></script>
</body>
</html>
