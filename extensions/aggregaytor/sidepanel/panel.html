<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aggregaytor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #0f1419;
      color: #e7e9ea;
      font-size: 14px;
      overflow-x: hidden;
    }
    .header {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header h1 { font-size: 18px; font-weight: 700; }
    .platform-filters {
      display: flex;
      gap: 6px;
      padding: 8px 16px;
      overflow-x: auto;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .platform-chip {
      padding: 4px 10px;
      border-radius: 16px;
      font-size: 12px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.05);
      color: #9ca3af;
      cursor: pointer;
      white-space: nowrap;
    }
    .platform-chip.active {
      background: rgba(59, 130, 246, 0.2);
      border-color: rgba(59, 130, 246, 0.5);
      color: #93c5fd;
    }
    .thread-list { padding: 0; }
    .thread-item {
      display: flex;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      cursor: pointer;
    }
    .thread-item:hover { background: rgba(255,255,255,0.03); }
    .thread-item.unread { background: rgba(59, 130, 246, 0.05); }
    .avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 600;
      color: rgba(255,255,255,0.6);
    }
    .thread-content { flex: 1; min-width: 0; }
    .thread-header { display: flex; justify-content: space-between; margin-bottom: 2px; }
    .thread-name { font-weight: 600; font-size: 14px; }
    .thread-time { font-size: 12px; color: #6b7280; }
    .thread-preview {
      font-size: 13px;
      color: #9ca3af;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .unread-badge {
      background: #3b82f6;
      color: white;
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 10px;
      font-weight: 600;
    }
    .empty-state {
      text-align: center;
      padding: 48px 24px;
      color: #6b7280;
    }
    .empty-state h2 { font-size: 16px; margin-bottom: 8px; color: #9ca3af; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Aggregaytor</h1>
    <span id="total-unread" class="unread-badge" style="display: none"></span>
  </div>
  <div class="platform-filters">
    <span class="platform-chip active" data-platform="all">All</span>
    <span class="platform-chip" data-platform="sniffies">Sniffies</span>
    <span class="platform-chip" data-platform="grindr">Grindr</span>
    <span class="platform-chip" data-platform="doublelist">DoubleList</span>
    <span class="platform-chip" data-platform="adam4adam">A4A</span>
    <span class="platform-chip" data-platform="gmail">Gmail</span>
    <span class="platform-chip" data-platform="yahoo">Yahoo</span>
  </div>
  <div id="thread-list" class="thread-list">
    <div class="empty-state">
      <h2>No messages yet</h2>
      <p>Visit a connected site to start capturing messages.</p>
    </div>
  </div>
  <script src="panel.js"></script>
</body>
</html>
