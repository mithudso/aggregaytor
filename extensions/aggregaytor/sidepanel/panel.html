<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aggregaytor</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body class="view-inbox">
  <div class="header">
    <button class="header-back" id="back-btn">&larr; Back</button>
    <h1 id="header-title">Aggregaytor</h1>
    <div id="header-actions" class="header-actions"></div>
    <span id="total-unread" class="unread-badge" style="display:none"></span>
  </div>

  <!-- Platform filter chips -->
  <div class="platform-filters">
    <span class="platform-chip active" data-platform="all">All</span>
    <span class="platform-chip" data-platform="sniffies">Sniffies</span>
    <span class="platform-chip" data-platform="grindr">Grindr</span>
    <span class="platform-chip" data-platform="doublelist">DList</span>
    <span class="platform-chip" data-platform="adam4adam">A4A</span>
  </div>

  <!-- Advanced filters -->
  <div class="filter-bar" id="filter-bar">
    <div class="filter-toggle" id="filter-toggle">Filters <span id="filter-count"></span></div>
    <div class="filter-panel" id="filter-panel" style="display:none">
      <div class="filter-row">
        <label>Search</label>
        <input type="text" id="filter-search" placeholder="Name or text..." class="filter-input">
      </div>
      <div class="filter-row">
        <label>Body</label>
        <select id="filter-body" class="filter-select" multiple size="3">
          <option value="slim">Slim</option><option value="athletic">Athletic</option>
          <option value="average">Average</option><option value="muscular">Muscular</option>
          <option value="chubby">Chubby</option><option value="stocky">Stocky</option>
        </select>
      </div>
      <div class="filter-row">
        <label>Position</label>
        <select id="filter-position" class="filter-select" multiple size="3">
          <option value="top">Top</option><option value="bottom">Bottom</option>
          <option value="vers">Vers</option><option value="vers top">Vers Top</option>
          <option value="vers bottom">Vers Bottom</option><option value="side">Side</option>
        </select>
      </div>
      <div class="filter-row">
        <label>Deletes</label>
        <select id="filter-deletes" class="filter-select">
          <option value="0">Any</option><option value="1">1+</option>
          <option value="3">3+</option><option value="5">5+</option>
        </select>
      </div>
      <div class="filter-row filter-toggles">
        <label><input type="checkbox" id="filter-responded"> Has responded</label>
        <label><input type="checkbox" id="filter-recent"> Active 24h</label>
        <label><input type="checkbox" id="filter-bookmarked"> Bookmarked</label>
      </div>
      <button class="filter-clear" id="filter-clear">Clear filters</button>
    </div>
  </div>

  <!-- Draft review bar -->
  <div id="draft-bar" class="draft-bar" style="display:none" onclick="toggleDraftPanel()">
    <span>Drafts pending review</span>
    <span id="draft-count" class="unread-badge">0</span>
  </div>
  <div id="draft-panel" class="draft-panel" style="display:none"></div>

  <!-- Inbox thread list -->
  <div id="thread-list" class="thread-list">
    <div class="empty-state"><h2>No messages yet</h2><p>Visit a connected site to start capturing messages.</p></div>
  </div>

  <!-- Thread detail view -->
  <div id="thread-detail" class="thread-detail">
    <!-- Notes editor (collapsible) -->
    <div id="notes-section" class="notes-section" style="display:none">
      <textarea id="notes-input" class="notes-input" placeholder="Add notes about this person..." rows="2"></textarea>
    </div>
    <!-- Reminder picker (collapsible) -->
    <div id="reminder-section" class="reminder-section" style="display:none">
      <div class="reminder-form">
        <input type="datetime-local" id="reminder-datetime" class="reminder-datetime">
        <input type="text" id="reminder-note" placeholder="Reminder note..." class="reminder-note-input">
        <button class="reminder-save" id="reminder-save">Set</button>
      </div>
      <div id="reminder-list" class="reminder-list"></div>
    </div>
    <!-- Conversation summary sidebar -->
    <div id="thread-summary" class="thread-summary">
      <div class="summary-section">
        <div class="summary-label">Sentiment</div>
        <div id="sentiment-display" class="sentiment-display"></div>
      </div>
      <div class="summary-section">
        <div class="summary-label">Preference</div>
        <div id="preference-display" class="preference-display"></div>
        <div class="pref-actions">
          <button class="pref-btn like" onclick="recordPref(true)" title="Like">👍</button>
          <button class="pref-btn dislike" onclick="recordPref(false)" title="Pass">👎</button>
        </div>
      </div>
      <div class="summary-section">
        <div class="summary-label">Summary</div>
        <div id="convo-summary" class="convo-summary"></div>
      </div>
      <div class="summary-section" id="commitments-section" style="display:none">
        <div class="summary-label">Commitments</div>
        <div id="commitments-display"></div>
      </div>
    </div>
    <div id="message-list" class="message-list"></div>
  </div>

  <!-- Suggestions -->
  <div id="suggestions" class="suggestions">
    <div class="label">Suggested responses</div>
  </div>

  <!-- Response bar -->
  <div class="response-bar">
    <textarea id="response-input" rows="1" placeholder="Type a response..."></textarea>
    <button class="suggest-btn" id="suggest-btn">Suggest</button>
  </div>

  <script src="panel.js"></script>
</body>
</html>
